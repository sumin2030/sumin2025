<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 갤러리 | Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-C4InODU0.svg">
    
    
    <style>
        :root {
            /* back 버튼 커스텀 영역: 여기만 수정해도 됩니다 */
            --back-top: 10px;
            --back-left: 10px;
            --back-padding-y: 10px;
            --back-padding-x: 14px;
            --back-radius: 999px;
            --back-font-size: 14px;
            --back-bg: rgba(255, 255, 255, 0.2);
            --back-border: 1px solid rgba(255, 255, 255, 0.32);
            --back-blur: 4px;
        }

        html, body {
            height: auto !important; 
            overflow-y: auto !important; 
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        #imageViewer {
            width: 100%;
            height: auto;
            display: block;
        }
        .viewer__inner {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .viewer__header {
            position: fixed;
            top: var(--back-top);
            left: var(--back-left);
            z-index: 9999;
            padding: 0;
            margin: 0;
            width: auto !important;
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
            display: block;
            pointer-events: none;
        }
        .back-btn {
            pointer-events: auto;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto !important;
            max-width: max-content;
            padding: var(--back-padding-y) var(--back-padding-x);
            margin: 0;
            background: var(--back-bg);
            border: var(--back-border);
            border-radius: var(--back-radius);
            backdrop-filter: blur(var(--back-blur));
            -webkit-backdrop-filter: blur(var(--back-blur));
            color: #000;
            font-size: var(--back-font-size);
            font-weight: 600;
            line-height: 1;
            appearance: none;
            -webkit-appearance: none;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .back-btn.is-dark-bg {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.42);
        }
        .back-btn.is-light-bg {
            color: #000;
            border-color: rgba(0, 0, 0, 0.2);
        }
        .viewer__title {
            display: none;
        }
        @media (max-width: 768px) {
            :root {
                --back-padding-y: 9px;
                --back-padding-x: 12px;
                --back-font-size: 13px;
            }
            .back-btn {
                padding: var(--back-padding-y) var(--back-padding-x);
                font-size: var(--back-font-size);
            }
        }
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image-info {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
    </style>
  <script type="module" crossorigin src="/assets/gallery-BfLrkuk7.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/gallery-DVjBze9V.css">
</head>
<body>

    <section id="imageViewer">
        <div class="viewer__inner">
            <div class="viewer__header">
                <button class="back-btn" onclick="location.href='index.html'">
                    &larr; back
                </button>
                <h2 class="viewer__title">나의 포트폴리오 갤러리</h2>
            </div>

            <div class="viewer__content">
                <div class="image-item">
                    <div class="image-container"></div>
                    <div class="image-info">
                        <div class="image-description">
                            <h3 class="dynamic-title">제목 로딩 중...</h3>
                            <p class="dynamic-desc">설명 로딩 중...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
